<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate - Page Not Found (404)</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--bg-body);
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-heading);
      margin-bottom: 0.75rem;
    }
    .error-desc {
      color: var(--text-muted);
      max-width: 480px;
      margin-bottom: 2rem;
      font-size: 1rem;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="error-wrapper">
    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem;">
      <img src="assets/logo.svg" alt="StudyMate Logo" width="38" height="38">
      <span style="font-size: 1.4rem; font-weight: 800; color: var(--text-heading);">Study<span style="color: var(--primary);">Mate</span></span>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The study page or resource you are looking for might have been moved, renamed, or is temporarily unavailable.</p>
    <div class="error-actions">
      <a href="dashboard.html" class="btn btn-primary btn-lg">
        <i class="fas fa-th-large"></i> Go to Dashboard
      </a>
      <a href="index.html" class="btn btn-outline btn-lg">
        <i class="fas fa-home"></i> Back to Home
      </a>
    </div>
  </div>
</body>
</html>
